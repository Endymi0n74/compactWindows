name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Release exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The project targets .NET Framework 4.7; make sure its targeting pack
      # (the v4.7 reference assemblies) exists on the runner.
      - name: Ensure .NET Framework 4.7 targeting pack
        shell: pwsh
        run: |
          $ref = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7'
          if (-not (Test-Path $ref)) {
            choco install netfx-4.7-devpack --yes --no-progress
          }

      # packages/ is gitignored, so the Ookii.Dialogs reference is restored from
      # the tracked copy in WindowsApp1/Resources (also embedded in the exe).
      - name: Restore Ookii.Dialogs reference
        shell: pwsh
        run: |
          $dest = 'packages\Ookii.Dialogs.WindowsForms.1.0\lib\net35'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item 'WindowsApp1\Resources\Ookii.Dialogs.dll' (Join-Path $dest 'Ookii.Dialogs.dll') -Force

      - name: Build Release
        run: msbuild WindowsApp1\CompactGUI.vbproj /p:Configuration=Release /v:minimal

      - name: Upload build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CompactGUI-Release
          path: WindowsApp1/bin/Release/CompactGUI.exe
          if-no-files-found: error

      - name: Zip portable build
        if: github.event_name == 'release' && github.event.action == 'created'
        shell: pwsh
        run: |
          Compress-Archive -Path 'WindowsApp1\bin\Release\CompactGUI.exe','WindowsApp1\bin\Release\CompactGUI.exe.config' `
            -DestinationPath "compactWindows-${{ github.event.release.tag_name }}.zip" -Force

      - name: Attach asset to release
        if: github.event_name == 'release' && github.event.action == 'created'
        uses: softprops/action-gh-release@v2
        with:
          files: compactWindows-*.zip
